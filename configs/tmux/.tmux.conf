# ====================================================
# 1. プレフィックスキー設定: Ctrl-Space を採用
# ----------------------------------------------------
# プレフィックスキーを Ctrl-Space に設定
set -g prefix C-Space
# デフォルトの Ctrl-b のバインドを解除
unbind C-b

# ====================================================
# 2. キーバインドの設定
# ----------------------------------------------------
set -g status-keys emacs   # tmuxコマンドラインはEmacs風のまま
set -g mode-keys vi        # コピーモードはvim風（vterm再現）
set -g renumber-windows on # window を閉じたら番号を自動で詰める
set -s set-clipboard off   # copy-command と helper を正本にして二重同期を避ける
set -sg escape-time 10     # terminal Emacs/Vim の ESC 系入力待ちを短くする
set -s copy-command "~/dotfiles/bin/clipboard-copy"

# ====================================================
# Kanagawa Dragon テーマ
# dragonBlack2=#1C1A1A dragonBlack4=#282727 dragonBlack5=#393836
# dragonWhite=#c5c9c5 dragonGreen=#87a987 dragonBlue2=#8ba4b0 dragonYellow=#c4b28a
# dragonAqua=#8ea4a2  dragonGray2=#9e9b93  dragonGray3=#7a8382
# ----------------------------------------------------

# ペインボーダー
set -g pane-border-style "fg=#393836"
set -g pane-active-border-style "fg=#c4b28a"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#c4b28a,bold] ACTIVE #P #{pane_current_command},#[fg=#625956] #P #{pane_current_command}}#[default]"

# アクティブペインは背景色ではなく、枠線と上部ラベルで識別する
set-hook -gu pane-focus-in
set-hook -gu pane-focus-out

# ステータスバー
set -g status-style "bg=#1C1A1A fg=#9e9b93"
set -g status-left "#[fg=#87a987,bold] #S #[fg=#393836,nobold] │ "
set -g status-right " #[fg=#393836]│ #[fg=#8ea4a2]%H:%M #[fg=#393836]│ #[fg=#7a8382]%Y-%m-%d "
set -g status-left-length 30
set -g status-right-length 40

# ウィンドウリスト
set -g window-status-format "#[fg=#625956] #I:#W "
set -g window-status-current-format "#[fg=#8ba4b0,bold] #I:#W "
set -g window-status-separator ""

# メッセージ・コピーモード
set -g message-style "bg=#282727 fg=#c5c9c5"
set -g message-command-style "bg=#282727 fg=#c5c9c5"
set -g mode-style "bg=#545d75 fg=#c5c9c5"

# コピーモード: vterm/Evil mode風キーバインド
bind-key -T copy-mode-vi v   send-keys -X begin-selection              # v: ビジュアル選択
bind-key -T copy-mode-vi V   send-keys -X select-line                  # V: 行選択
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle             # C-v: 矩形選択
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel         # y: ヤンク→tmux buffer + copy-command
bind-key -T copy-mode-vi i   send-keys -X cancel                       # i: インサートモードへ戻る
bind-key -T copy-mode-vi Escape send-keys -X cancel                    # Esc: キャンセル

# Ctrl-Space Ctrl-Space でcopy mode起動
bind C-Space copy-mode

# Ctrl-Space p で system clipboard を現在ペインへ貼り付け
bind p run-shell "$HOME/dotfiles/bin/tmux-paste"

# 既存ペインを現在 window に取り込む / 別 window へ送る
# 小文字 j は pane 移動で使っているため、Join は大文字 J に寄せる
bind J display-panes \; command-prompt -p "Join pane from (e.g. %1 or :.1):" "join-pane -s '%%'"
bind s display-panes \; command-prompt -p "Send pane to (e.g. %2 or :.2):" "join-pane -t '%%'"

# ====================================================
# 3. 操作性向上のための追加設定 (推奨)
# ----------------------------------------------------
# マウス操作の有効化 (ペイン選択、サイズ変更、スクロールが可能に)
set -g mouse on

# 分割キーの変更 (より直感的に)
bind / split-window -h
bind - split-window -v
unbind %
unbind '"'

# ペイン移動: hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 設定ファイルを再読み込みするためのキーバインド (設定変更後、Prefix + r で反映)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ====================================================
# 4. バッファ管理（Spacemacs SPC b * 相当）
# ----------------------------------------------------
# セッション作成時にbgウィンドウを自動生成し、常に末尾へ移動
set-hook -g session-created 'run-shell -b "sleep 0.05; $HOME/dotfiles/bin/tmux-ensure-bg-last #{q:hook_session}"'
set-hook -gu after-new-window
set-hook -g window-linked 'run-shell -b "sleep 0.05; $HOME/dotfiles/bin/tmux-ensure-bg-last #{q:hook_session}"'
set-hook -g window-unlinked 'run-shell -b "sleep 0.05; $HOME/dotfiles/bin/tmux-ensure-bg-last #{q:hook_session}"'
set-hook -g session-window-changed 'run-shell -b "sleep 0.05; $HOME/dotfiles/bin/tmux-ensure-bg-last #{q:hook_session}"'


# ウィンドウ名をディレクトリ名で自動命名（バッファとして識別しやすくする）
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# b: bgのペインをfzfで選んで現在のペインとswap → SPC b b
# run-shellはフォーマット展開が確実なため、ラッパー経由でdisplay-popupに値を橋渡し
bind b run-shell "$HOME/dotfiles/bin/fzf-buffer-popup '#{pane_id}' '#{session_name}' '#{pane_current_path}'"

# x: 現在のペインをbgの最新ペインと入れ替え、元のペインを削除（外枠維持）
# X: ペインを削除（外枠も消す）
bind x run-shell "$HOME/dotfiles/bin/tmux-kill-buffer '#{pane_id}' '#{session_name}'"
bind X confirm-before -p "kill pane? (y/n)" kill-pane

# ====================================================
# 5. fzf ポップアップ（セカンドキーをzshのCtrl+X *と統一）
# ----------------------------------------------------
# p: 通常ペースト（既存）、P: 履歴から選んでペースト
bind P display-popup -d "#{pane_current_path}" -E \
  "$HOME/dotfiles/bin/fzf-clipboard | tmux load-buffer - && tmux paste-buffer"

# ====================================================
# 5. スクロール
# ----------------------------------------------------
# Ctrl-Space Ctrl-Y でコピーモードに入りながら上スクロール
# コピーモード内では Ctrl-Y / j / k でそのまま操作可能
bind C-y copy-mode \; send-keys -X scroll-up
